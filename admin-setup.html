<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Setup</title>
    <link rel="stylesheet" href="webroot/style.css" />
    <style>
      body { margin: 0; min-height: 100vh; background: #eef3f0; color: #17211d; font-family: Georgia, serif; }
      .setup-shell { max-width: 620px; margin: 60px auto; padding: 24px; }
      .setup-card { background: #fff; border: 1px solid #d6e1db; border-radius: 12px; padding: 24px; box-shadow: 0 12px 24px rgba(17, 38, 32, 0.06); }
      .setup-header { margin-bottom: 18px; }
      .setup-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
      .setup-field { margin-bottom: 16px; }
      .setup-field label { display: block; margin-bottom: 8px; font-weight: 700; }
      .setup-field input { width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 8px; border: 1px solid #d8e0dc; background: #f8faf9; }
      .helper { color: #4d5f59; font-size: 0.92rem; }
      .status-box { margin-top: 16px; padding: 10px 12px; border-radius: 8px; background: #eefaf5; border: 1px solid #d8ece1; }
      .status-box.error { background: #fff1ef; border-color: #f2d1cc; }
      .status-box.success { background: #edf9f2; border-color: #d4ecde; }
      .meta-box { margin-top: 18px; padding: 12px; border-radius: 8px; background: #f7faf8; border: 1px solid #dfeae5; color: #34524c; font-size: 0.9rem; }
      .danger { background: #872a24; border-color: #872a24; color: #fff; }
    </style>
  </head>
  <body>
    <div class="setup-shell">
      <div class="setup-card">
        <div class="setup-header">
          <span class="user-app-eyebrow">Local admin setup</span>
          <h1>Offline-first developer bootstrap</h1>
          <p class="helper">This preview only uses local browser storage. No server password or external auth service is required.</p>
        </div>

        <div class="setup-field">
          <label for="developerUsername">Username</label>
          <input id="developerUsername" type="text" value="Developer" readonly />
        </div>

        <div class="setup-field">
          <label for="developerPassword">Password</label>
          <input id="developerPassword" type="password" placeholder="Enter the local developer password" />
        </div>

        <div class="setup-field">
          <label for="developerPasswordConfirm">Repeat password</label>
          <input id="developerPasswordConfirm" type="password" placeholder="Repeat the password" />
        </div>

        <div class="setup-actions">
          <button id="saveDeveloperBtn" class="primary" type="button">Save local developer</button>
          <button id="resetDeveloperBtn" class="secondary danger" type="button">Reset local developer</button>
          <a class="secondary nav-item" href="webroot/index.php">Open app</a>
        </div>

        <div id="setupStatus" class="status-box info">Checking the current local developer configuration…</div>

        <div id="setupMeta" class="meta-box"></div>
      </div>
    </div>

    <script src="platform/core.js"></script>
    <script src="platform/core-event-bus.js"></script>
    <script src="platform/core-error-handler.js"></script>
    <script src="platform/error-log.js"></script>
    <script src="platform/core-config.js"></script>
    <script src="platform/core-context.js"></script>
    <script src="platform/core-lifecycle.js"></script>
    <script src="platform/core-state.js"></script>
    <script src="platform/core-storage.js"></script>
    <script src="platform/module-interface.js"></script>
    <script src="platform/module-registry.js"></script>
    <script src="platform/module-manager.js"></script>
    <script src="platform/core-loader.js"></script>
    <script src="platform/config-manager.js"></script>
    <script src="platform/database-manager.js"></script>
    <script src="platform/security.js"></script>
    <script src="platform/core-auth.js"></script>
    <script src="platform/core-access.js"></script>
    <script src="platform/core-audit.js"></script>
    <script src="platform/core-event-ring.js"></script>
    <script src="platform/core-user.js"></script>
    <script src="platform/core-admin.js"></script>
    <script src="platform/service-manager.js"></script>
    <script src="platform/core-startup.js"></script>
    <script src="platform/core-runtime.js"></script>
    <script src="platform/core-entry.js"></script>
    <script src="platform/local-auth.js"></script>
    <script>
      (() => {
        const statusBox = document.getElementById('setupStatus');
        const metaBox = document.getElementById('setupMeta');
        const setStatus = (message, type = 'info') => {
          statusBox.textContent = message;
          statusBox.className = `status-box ${type}`;
        };

        const refreshState = () => {
          if (!window.LocalAuth || typeof window.LocalAuth.getState !== 'function') {
            metaBox.innerHTML = 'Local auth is unavailable in this environment.';
            return;
          }

          const state = window.LocalAuth.getState();
          const configured = !!state.passwordHash && !!state.setupComplete;
          metaBox.innerHTML = `
            <div><strong>Storage:</strong> Neutral Framework (local auth)</div>
            <div><strong>Account:</strong> ${state.username || 'Developer'}</div>
            <div><strong>Configured:</strong> ${configured ? 'yes' : 'no'}</div>
            <div><strong>Password set:</strong> ${state.passwordHash ? 'yes' : 'no'}</div>
          `;

          if (configured) {
            setStatus('A local developer account is already configured. You may reset it or save a new password.', 'success');
          } else {
            setStatus('No local developer account is configured yet. Set a password to create one.', 'info');
          }
        };

        document.getElementById('saveDeveloperBtn').addEventListener('click', async () => {
          const password = document.getElementById('developerPassword').value;
          const confirmPassword = document.getElementById('developerPasswordConfirm').value;

          if (!password || password !== confirmPassword) {
            setStatus('Passwords do not match or are empty.', 'error');
            return;
          }

          if (!window.LocalAuth || typeof window.LocalAuth.setupDeveloper !== 'function') {
            setStatus('Local auth is unavailable in this environment.', 'error');
            return;
          }

          const result = await window.LocalAuth.setupDeveloper({ username: 'Developer', password });
          if (result && result.ok) {
            setStatus('Local developer account saved. Redirecting to the app login.', 'success');
            setTimeout(() => { window.location.assign('webroot/index.php'); }, 900);
          } else {
            setStatus(result && result.message ? result.message : 'Developer setup failed.', 'error');
          }

          refreshState();
        });

        document.getElementById('resetDeveloperBtn').addEventListener('click', () => {
          if (!window.LocalAuth || typeof window.LocalAuth.resetDeveloperAccount !== 'function') {
            setStatus('Local auth reset is unavailable in this environment.', 'error');
            return;
          }

          const result = window.LocalAuth.resetDeveloperAccount();
          if (result && result.ok) {
            setStatus('Local developer state has been reset. You can create a fresh local account now.', 'success');
            document.getElementById('developerPassword').value = '';
            document.getElementById('developerPasswordConfirm').value = '';
          } else {
            setStatus(result && result.message ? result.message : 'Reset failed.', 'error');
          }

          refreshState();
        });

        if (window.CoreStartup && typeof window.CoreStartup.start === 'function') {
          window.CoreStartup.start().catch(() => {});
        }
        refreshState();
      })();
    </script>
  </body>
</html>
