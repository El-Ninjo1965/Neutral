name: Production HTTP Read-only Smoke

on:
  push:
    branches:
      - codex/ftps-readonly-diagnostic

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Bestehende Produktion rein lesend prüfen
        shell: bash
        run: |
          set -euo pipefail

          TEMP_DIR="$(mktemp -d)"
          ROOT_BODY="$TEMP_DIR/root.html"
          ADMIN_BODY="$TEMP_DIR/admin.html"
          USER_APP_BODY="$TEMP_DIR/user-app.js"
          API_BODY="$TEMP_DIR/status.json"
          SERVER_BODY="$TEMP_DIR/server-internal.txt"

          ROOT_STATUS="$(curl -sS -L --max-time 20 -o "$ROOT_BODY" -w '%{http_code}' 'https://www.turbolikes.com/')"
          ADMIN_STATUS="$(curl -sS -L --max-time 20 -o "$ADMIN_BODY" -w '%{http_code}' 'https://www.turbolikes.com/admin.php')"
          USER_APP_STATUS="$(curl -sS -L --max-time 20 -o "$USER_APP_BODY" -w '%{http_code}' 'https://www.turbolikes.com/user-app.js')"
          API_STATUS="$(curl -sS -L --max-time 20 -o "$API_BODY" -w '%{http_code}' 'https://www.turbolikes.com/api/v1/status')"
          SERVER_STATUS="$(curl -sS -L --max-time 20 -o "$SERVER_BODY" -w '%{http_code}' 'https://www.turbolikes.com/Server/php/bootstrap.php')"

          printf '{"root_status":%s,"admin_status":%s,"user_app_status":%s,"api_status":%s,"server_internal_status":%s}\n' \
            "$ROOT_STATUS" "$ADMIN_STATUS" "$USER_APP_STATUS" "$API_STATUS" "$SERVER_STATUS"

          test "$ROOT_STATUS" = '200'
          test "$ADMIN_STATUS" = '401'
          test "$USER_APP_STATUS" = '200'
          test "$API_STATUS" = '200'
          case "$SERVER_STATUS" in 403|404) ;; *) exit 1 ;; esac
          printf '%s\n' 'checkpoint=statuses_ok'

          grep -Eq '<title([^>]*)?>Neutral Platform</title>' "$ROOT_BODY"
          if grep -Fqi 'FRAMEWORK DASHBOARD' "$ROOT_BODY"; then exit 1; fi
          printf '%s\n' 'checkpoint=root_content_ok'

          ADMIN_INPUT="$(grep -o '<input id="loginUsername"[^>]*>' "$ADMIN_BODY" | head -n 1)"
          test -n "$ADMIN_INPUT"
          if printf '%s' "$ADMIN_INPUT" | grep -Eqi '[[:space:]]value='; then exit 1; fi
          printf '%s\n' 'checkpoint=admin_login_empty_ok'

          grep -Fq '<input id="userLoginUsername" type="text" autocomplete="username" />' "$USER_APP_BODY"
          if grep -Eq '\.value\.trim\(\)[[:space:]]*\|\|[[:space:]]*["'"']Developer["'"']' "$USER_APP_BODY"; then exit 1; fi
          printf '%s\n' 'checkpoint=user_login_empty_ok'
          node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))" "$API_BODY"
          printf '%s\n' 'checkpoint=api_json_ok'

          printf '{"login_identifiers_empty":true}\n'
