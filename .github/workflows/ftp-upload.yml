name: FTPS Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[cleanup-public-html]') }}
    runs-on: ubuntu-latest
    outputs:
      failed_stage: ${{ steps.diagnosis.outputs.failed_stage }}
    env:
      FTP_HOST: server.cpprotect5.de
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: '21'
      FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
      FTP_SSL_CHECK_HOSTNAME: 'true'
      NEUTRAL_BASE_PATH: ${{ vars.NEUTRAL_BASE_PATH || '' }}
      NEUTRAL_PUBLIC_URL: 'https://turbolikes.com/'
      NEUTRAL_SMOKE_VIEWER_MODULES: 'gps'

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Produktionsziel prüfen
        id: target
        shell: bash
        run: |
          set -euo pipefail
          node -e "require('./scripts/production-readonly-smoke').validateDeploymentTarget(process.env.NEUTRAL_PUBLIC_URL, process.env.NEUTRAL_BASE_PATH)"

      - name: Vollständige Node- und PHP-Tests ausführen
        id: tests
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v php >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y php-cli
          fi
          php -v
          npm ci
          set +e
          npm test
          TEST_EXIT=$?
          set -e

          FAILED_TEST='none'
          if [ "$TEST_EXIT" -ne 0 ]; then
            for TEST_FILE in tests/*.test.js; do
              if ! node --test --test-concurrency=1 "$TEST_FILE" >/dev/null 2>&1; then
                FAILED_TEST="$(basename "$TEST_FILE" .test.js)"
                break
              fi
            done
          fi
          printf 'failed_test=%s\n' "$FAILED_TEST" >> "$GITHUB_OUTPUT"
          exit "$TEST_EXIT"

      - name: Verifiziertes Produktionspaket bauen
        id: package
        shell: bash
        run: |
          set -euo pipefail

          STAGING_DIR="$GITHUB_WORKSPACE/dist/neutral-production"
          npm run package:production -- \
            --base-path="$NEUTRAL_BASE_PATH" \
            --output="$STAGING_DIR"

          test -f "$STAGING_DIR/Web-App/public/index.html"
          test -f "$STAGING_DIR/Web-App/app/modules/gps/module.json"
          test -f "$STAGING_DIR/Server/public/api/index.php"
          test -f "$STAGING_DIR/Server/php/bootstrap.php"
          test -f "$STAGING_DIR/.env.example"
          test -f "$STAGING_DIR/manifest.json"
          test -f "$STAGING_DIR/SHA256SUMS"
          echo "Staging tree:"
          find "$STAGING_DIR" -type f | sort

      - name: FTPS-Client bereitstellen
        id: client
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v lftp >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y lftp
          fi

      - name: Produktionsbestand per FTPS hochladen
        id: upload
        shell: bash
        run: |
          set -euo pipefail

          FTP_SERVER="$FTP_HOST" \
          FTP_USERNAME="$FTP_USER" \
          FTP_PROTOCOL="ftps" \
          node scripts/manual-ftps-deploy.js

      - name: Produktionsstand rein lesend prüfen
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          node scripts/production-readonly-smoke.js

      - name: Fehlgeschlagene Stufe begrenzt erfassen
        id: diagnosis
        if: ${{ always() }}
        shell: bash
        env:
          TARGET_OUTCOME: ${{ steps.target.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          TEST_FAILURE: ${{ steps.tests.outputs.failed_test }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          CLIENT_OUTCOME: ${{ steps.client.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          FAILED_STAGE='none'
          for STAGE in target tests package client upload smoke; do
            OUTCOME_VAR="${STAGE^^}_OUTCOME"
            if [ "${!OUTCOME_VAR}" != 'success' ]; then
              FAILED_STAGE="$STAGE"
              break
            fi
          done
          if [ "$FAILED_STAGE" = 'tests' ] && [[ "$TEST_FAILURE" =~ ^[a-z0-9-]+$ ]] && [ "$TEST_FAILURE" != 'none' ]; then
            FAILED_STAGE="tests/$TEST_FAILURE"
          fi
          printf 'failed_stage=%s\n' "$FAILED_STAGE" >> "$GITHUB_OUTPUT"

  report:
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[cleanup-public-html]')) }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Lesbaren Produktionsstatus setzen
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ needs.deploy.result }}';
            const failedStage = '${{ needs.deploy.outputs.failed_stage }}' || 'unknown';
            const state = result === 'success' ? 'success' : 'failure';
            const statusContext = state === 'success'
              ? 'production/ftps-http'
              : `production/ftps-http/${failedStage}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: statusContext,
              description: state === 'success'
                ? 'FTPS deployment and read-only HTTP smoke passed'
                : `Production pipeline failed at ${failedStage}`
            });
