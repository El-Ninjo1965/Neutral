name: Neutral Sync & FTPS Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-server:
    name: Deploy Neutral server
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ secrets.FTP_PORT || 21 }}
      FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR || '/' }}
      FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL || 'ftps' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v lftp >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y lftp
          fi

      - name: Deploy server bundle
        shell: bash
        run: |
          set -euo pipefail
          node scripts/manual-ftps-deploy.js --server

  deploy-web-app:
    name: Deploy public web app
    runs-on: ubuntu-latest
    env:
      WEB_APP_FTP_HOST: ${{ secrets.WEB_APP_FTP_HOST }}
      WEB_APP_FTP_SERVER: ${{ secrets.WEB_APP_FTP_SERVER }}
      WEB_APP_FTP_USER: ${{ secrets.WEB_APP_FTP_USER }}
      WEB_APP_FTP_USERNAME: ${{ secrets.WEB_APP_FTP_USERNAME }}
      WEB_APP_FTP_PASSWORD: ${{ secrets.WEB_APP_FTP_PASSWORD }}
      WEB_APP_FTP_PORT: ${{ secrets.WEB_APP_FTP_PORT || 21 }}
      WEB_APP_FTP_PATH: ${{ secrets.WEB_APP_FTP_PATH || '/' }}
      WEB_APP_FTP_ROOT: ${{ secrets.WEB_APP_FTP_ROOT || '/' }}
      WEB_APP_FTP_MODE: ${{ secrets.WEB_APP_FTP_MODE || 'explicit' }}
      WEB_APP_URL: ${{ secrets.WEB_APP_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v lftp >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y lftp
          fi

      - name: Deploy web app bundle
        shell: bash
        run: |
          set -euo pipefail
          node scripts/manual-ftps-deploy.js --web-app
