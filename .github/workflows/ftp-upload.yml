name: FTPS Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ secrets.FTP_PORT || 21 }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Produktions-Staging aufbauen
        shell: bash
        run: |
          set -euo pipefail

          STAGING_DIR="${RUNNER_TEMP}/neutral-ftps-staging"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"

          copy_file() {
            local source_path="$1"
            local target_path="$STAGING_DIR/$1"
            mkdir -p "$(dirname "$target_path")"
            cp -p "$source_path" "$target_path"
          }

          copy_dir() {
            local source_path="$1"
            local target_path="$STAGING_DIR/$1"
            mkdir -p "$target_path"
            cp -a "$source_path"/. "$target_path"/
          }

          # Production is sourced exclusively from the two runtime components.
          copy_dir Web-App
          copy_dir Server/php
          copy_dir Server/public
          echo "Staging tree:"
          find "$STAGING_DIR" -type f | sort

      - name: FTPS-Client bereitstellen
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v lftp >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y lftp
          fi

      - name: Produktionsbestand per FTPS hochladen
        shell: bash
        run: |
          set -euo pipefail

          STAGING_DIR="${RUNNER_TEMP}/neutral-ftps-staging"

          lftp <<EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:timeout 30
          set net:max-retries 1
          open -u "$FTP_USER","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST"
          mirror -R --only-newer --verbose \
            --exclude-glob .env \
            --exclude-glob app-node-test \
            --exclude-glob app-node-test/** \
            "$STAGING_DIR" /
          bye
          EOF

      - name: Veraltete HTML-Entrypoints entfernen
        shell: bash
        run: |
          set -euo pipefail

          lftp <<EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:timeout 30
          set net:max-retries 1
          open -u "$FTP_USER","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST"
          rm -f "/admin.html"
          rm -f "/setup.html"
          bye
          EOF
