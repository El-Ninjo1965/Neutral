name: FTPS Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[cleanup-public-html]') }}
    runs-on: ubuntu-latest
    env:
      FTP_HOST: server.cpprotect5.de
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: '21'
      FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
      FTP_SSL_CHECK_HOSTNAME: 'true'
      NEUTRAL_BASE_PATH: ${{ vars.NEUTRAL_BASE_PATH || '' }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Vollständige Node- und PHP-Tests ausführen
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v php >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y php-cli
          fi
          php -v
          npm ci
          npm test

      - name: Verifiziertes Produktionspaket bauen
        shell: bash
        run: |
          set -euo pipefail

          STAGING_DIR="$GITHUB_WORKSPACE/dist/neutral-production"
          npm run package:production -- \
            --base-path="$NEUTRAL_BASE_PATH" \
            --output="$STAGING_DIR"

          test -f "$STAGING_DIR/Web-App/public/index.html"
          test -f "$STAGING_DIR/Web-App/app/modules/gps/module.json"
          test -f "$STAGING_DIR/Server/public/api/index.php"
          test -f "$STAGING_DIR/Server/php/bootstrap.php"
          test -f "$STAGING_DIR/.env.example"
          test -f "$STAGING_DIR/manifest.json"
          test -f "$STAGING_DIR/SHA256SUMS"
          echo "Staging tree:"
          find "$STAGING_DIR" -type f | sort

      - name: FTPS-Client bereitstellen
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v lftp >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y lftp
          fi

      - name: Produktionsbestand per FTPS hochladen
        shell: bash
        run: |
          set -euo pipefail

          FTP_SERVER="$FTP_HOST" \
          FTP_USERNAME="$FTP_USER" \
          FTP_PROTOCOL="ftps" \
          node scripts/manual-ftps-deploy.js
