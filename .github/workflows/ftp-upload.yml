name: FTPS Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[cleanup-public-html]') }}
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ secrets.FTP_PORT || 21 }}
      FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR || '/' }}
      FTP_SSL_CHECK_HOSTNAME: ${{ secrets.FTP_SSL_CHECK_HOSTNAME || 'true' }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Produktions-Staging aufbauen
        shell: bash
        run: |
          set -euo pipefail

          STAGING_DIR="${RUNNER_TEMP}/neutral-ftps-staging"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"

          copy_dir() {
            local source_path="$1"
            local target_path="$STAGING_DIR/$1"
            mkdir -p "$target_path"
            cp -a "$source_path"/. "$target_path"/
          }

          # Production consists only of the browser Web-App and PHP server.
          # The Node adapter remains development/test-only and is not deployed.
          copy_dir Web-App
          copy_dir Server/php
          copy_dir Server/public
          cp .htaccess "$STAGING_DIR/.htaccess"

          test -f "$STAGING_DIR/Web-App/public/index.html"
          test -f "$STAGING_DIR/Web-App/app/modules/gps/module.json"
          test -f "$STAGING_DIR/Server/public/api/index.php"
          test -f "$STAGING_DIR/Server/php/bootstrap.php"
          echo "Staging tree:"
          find "$STAGING_DIR" -type f | sort

      - name: FTPS-Client bereitstellen
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v lftp >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y lftp
          fi

      - name: Produktionsbestand per FTPS hochladen
        shell: bash
        run: |
          set -euo pipefail

          STAGING_DIR="${RUNNER_TEMP}/neutral-ftps-staging"

          lftp <<EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:check-hostname $FTP_SSL_CHECK_HOSTNAME
          set ssl:verify-certificate true
          set net:timeout 30
          set net:max-retries 1
          open -u "$FTP_USER","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST"
          mirror -R --only-newer --verbose \
            --exclude-glob .env \
            "$STAGING_DIR" "$FTP_TARGET_DIR"
          bye
          EOF

      - name: Neuinstallation verifizieren und Testartefakte entfernen
        shell: bash
        run: |
          set -euo pipefail

          RESULT_FILE="${RUNNER_TEMP}/neutral-db-reset-result.json"
          RESULT_PATH="${FTP_TARGET_DIR%/}/Server/public/neutral-db-reset-result-91c4e7a2.php"

          lftp <<EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:check-hostname $FTP_SSL_CHECK_HOSTNAME
          set ssl:verify-certificate true
          set net:timeout 30
          set net:max-retries 1
          open -u "$FTP_USER","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST"
          get "$RESULT_PATH" -o "$RESULT_FILE"
          rm -f "${FTP_TARGET_DIR%/}/Server/public/neutral-db-inspect-91c4e7a2.php"
          rm -f "${FTP_TARGET_DIR%/}/Server/public/neutral-db-result-91c4e7a2.json"
          rm -f "${FTP_TARGET_DIR%/}/Server/public/neutral-db-result-91c4e7a2.php"
          rm -f "${FTP_TARGET_DIR%/}/Server/public/neutral-db-reset-91c4e7a2.php"
          rm -f "${FTP_TARGET_DIR%/}/Server/public/neutral-db-action-91c4e7a2.php"
          rm -f "${FTP_TARGET_DIR%/}/Server/public/neutral-e2e-91c4e7a2.php"
          rm -f "${FTP_TARGET_DIR%/}/Server/public/neutral-db-reset-result-91c4e7a2.php"
          bye
          EOF

          jq -e '
            .marker == "neutral-db-reset-91c4e7a2" and
            (.identity_verified == true) and
            (.table_set_verified == true) and
            (.tables_dropped == 15) and
            (.installation_active == true) and
            (.migration_pending_count == 0) and
            (.post_install_tables | type == "array") and
            (.error_category == null) and
            (.self_deleted == true) and
            (.result_persisted == true)
          ' "$RESULT_FILE" >/dev/null
          jq '{marker, identity_verified, table_set_verified, tables_dropped, installation_active, migration_pending_count, post_install_tables, error_category, self_deleted, result_persisted}' "$RESULT_FILE"
